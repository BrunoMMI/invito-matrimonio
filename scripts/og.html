<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:radial-gradient(ellipse at 30% 40%,#FBF8EF,#F6F2E7 60%,#EEE8D8);font-family:'Libre Bodoni',serif;color:#1B1B1B;display:flex;align-items:center;justify-content:center;gap:70px;overflow:hidden;position:relative}
.frame{position:absolute;inset:22px;border:1.5px solid rgba(31,75,51,.35)}
.tag{background:#FBF8EF;padding:16px;box-shadow:0 24px 50px -24px rgba(23,58,40,.6);transform:rotate(-2deg)}
.tag img{width:430px;height:352px;object-fit:cover;display:block}
.txt{text-align:center;width:460px}
.k{font-style:italic;color:#1F4B33;font-size:26px;margin-bottom:12px}
.m{font-size:150px;font-weight:500;line-height:1}
.m span{color:#1F4B33;font-weight:400}
.n{font-size:38px;margin-top:18px}
.d{margin-top:16px;letter-spacing:.22em;text-transform:uppercase;font-size:22px;font-weight:500}
.d i{display:block;letter-spacing:0;text-transform:none;color:#1F4B33;font-weight:400;font-size:22px;margin-bottom:2px}
</style></head><body>
<div class="frame"></div>
<div class="tag"><img src="../assets/img/orso-volpe.webp"></div>
<div class="txt"><div class="k">l’Orso e la Volpe si sposano</div><div class="m">D<span>&amp;</span>A</div><div class="n">Davide &amp; Amalia</div><div class="d"><i>Domenica</i>13 Dicembre 2026</div></div>
</body></html>
